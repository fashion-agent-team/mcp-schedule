plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.0.9'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.fashionagent'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springAiVersion', '2.0.2')
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // 게이트웨이가 넘긴 로그인 토큰(JWT)을 직접 확인 (2026-11-23, X-User-Id 헤더 대신)
    implementation 'com.nimbusds:nimbus-jose-jwt:10.5'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springframework.ai:spring-ai-starter-mcp-server-webmvc'

    // DB는 PostgreSQL. SPRING_DATASOURCE_URL이 없으면 메모리 DB(H2, PostgreSQL 모드)로 뜹니다(테스트·빠른 실행용).
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.h2database:h2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    // 통합 테스트(ScheduleIntegrationTest)용 진짜 PostgreSQL. Docker가 없으면 TEST_DB_URL, 둘 다 없으면 그 테스트만 건너뜁니다.
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// 테스트 커버리지(JaCoCo). 줄 커버리지가 80% 미만이면 빌드(CI)가 실패한다.
// 보고서: build/reports/jacoco/test/html/index.html
jacoco {
    toolVersion = '0.8.14'
}

tasks.named('test') {
    finalizedBy 'jacocoTestReport'
}

tasks.named('jacocoTestReport') {
    dependsOn 'test'
    reports {
        xml.required = true
        csv.required = true
        html.required = true
    }
}

tasks.named('jacocoTestCoverageVerification') {
    dependsOn 'test'
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
        }
    }
}

tasks.named('check') {
    dependsOn 'jacocoTestCoverageVerification'
}
