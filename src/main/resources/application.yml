server:
  port: ${PORT:8092}

spring:
  application:
    name: mcp-schedule
  jackson:
    time-zone: Asia/Seoul
  datasource:
    # PostgreSQL 예: jdbc:postgresql://localhost:5432/fashion
    # 값이 없으면 메모리 DB(H2, PostgreSQL 모드)로 뜹니다(껐다 켜면 일정이 사라짐).
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:schedule;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # 테이블은 Flyway(db/migration)가 만들고, JPA는 엔티티와 맞는지 확인만 합니다.
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: schedule
        jdbc:
          time_zone: UTC
  flyway:
    # 이 서비스는 schedule 스키마만 씁니다(약속 문서 7절). 이력 표도 schedule 안에 둡니다.
    schemas: schedule
    default-schema: schedule
    create-schemas: true
  ai:
    mcp:
      server:
        name: mcp-schedule
        version: 0.1.0
        type: sync
        protocol: streamable
        streamable-http:
          mcp-endpoint: /mcp
        instructions: "사용자 일정을 등록·조회·삭제합니다. 일정마다 장소 종류(placeCategory)와 자리 종류(occasion)를 돌려줍니다. 옷이 맞는지는 판단하지 않습니다."

schedule:
  zone: Asia/Seoul
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY:}
  reminder:
    cron: "0 0 8 * * *"
  # 격식 일정 3일 전 드라이클리닝 알림
  care-reminder:
    cron: "0 0 8 * * *"

management:
  endpoints:
    web:
      exposure:
        include: health
