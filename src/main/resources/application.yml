server:
  port: ${PORT:8092}

spring:
  application:
    name: mcp-schedule
  jackson:
    time-zone: Asia/Seoul
  datasource:
    # 값이 없으면 메모리 DB(H2)로 뜹니다. 팀 DB에 붙일 때는 SPRING_DATASOURCE_URL/USERNAME/PASSWORD를 넣으세요.
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:schedule;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS schedule}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # 첫 버전은 테이블을 자동으로 만듭니다. 스키마가 굳으면 Flyway로 바꿉니다.
      ddl-auto: ${SCHEDULE_DDL_AUTO:update}
    properties:
      hibernate:
        default_schema: ${SCHEDULE_DB_SCHEMA:schedule}
        jdbc:
          time_zone: UTC
  ai:
    mcp:
      server:
        name: mcp-schedule
        version: 0.1.0
        type: sync
        protocol: streamable
        streamable-http:
          mcp-endpoint: /mcp
        instructions: "사용자 일정을 등록·조회·삭제합니다. 일정마다 장소 종류(placeCategory)와 자리 종류(occasion)를 돌려줍니다. 옷이 맞는지는 판단하지 않습니다."

schedule:
  zone: Asia/Seoul
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY:}
  reminder:
    cron: "0 0 8 * * *"

management:
  endpoints:
    web:
      exposure:
        include: health
